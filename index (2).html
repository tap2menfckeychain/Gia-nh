<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gia Đình - Scrapbook Kỷ Niệm Pastel Hồng Tím</title>
  
  <!-- Google Fonts Hỗ Trợ Tiếng Việt Chuẩn (Pinyon Script, Dancing Script, Cormorant Garamond, Montserrat) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500;1,600&family=Dancing+Script:wght@600;700&family=Montserrat:wght@300;400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ==========================================================================
       1. CẤU HÌNH BIẾN & THIẾT KẾ MÀU LỚP PASTEL HỒNG TÍM
       ========================================================================== */
    :root {
      --bg-pink-pastel: #FFF0F3;
      --bg-purple-pastel: #F3E8FF;
      --card-bg: rgba(255, 255, 255, 0.92);
      --primary-pink: #E88D9E;
      --primary-purple: #B197FC;
      --dark-title: #6B4E71;
      --text-main: #523D54;
      --text-sub: #8E7A93;
      --shadow-soft: 0 12px 35px rgba(177, 151, 252, 0.2);
      --radius-medium: 20px;
      --transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: linear-gradient(135deg, var(--bg-pink-pastel) 0%, #FDF2F8 50%, var(--bg-purple-pastel) 100%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
      line-height: 1.8;
      overflow-x: hidden;
    }

    /* Font Tiêu đề Serif mềm mại hỗ trợ tiếng Việt đầy đủ */
    h1, h2, h3, .serif-font { 
      font-family: 'Cormorant Garamond', serif; 
      font-style: italic;
    }
    
    /* Font Chữ viết tay Việt hóa chuẩn nét */
    .handwriting { 
      font-family: 'Dancing Script', cursive; 
      font-weight: 700;
    }

    .handwriting-fancy {
      font-family: 'Pinyon Script', cursive;
    }

    /* ==========================================================================
       2. MÀN HÌNH MỞ THƯ (CHE KÍN BÊN DƯỚI)
       ========================================================================== */
    #envelope-screen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: #FFF0F3;
      background-image: radial-gradient(rgba(232, 141, 158, 0.2) 1.5px, transparent 1.5px),
                        linear-gradient(135deg, #FFF0F3 0%, #F5E6FF 100%);
      background-size: 24px 24px, 100% 100%; 
      z-index: 99999;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      transition: opacity 0.6s ease, visibility 0.6s ease; padding: 20px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #envelope-screen.hide { 
      opacity: 0; 
      visibility: hidden; 
      pointer-events: none !important; 
    }

    .envelope-wrapper {
      position: relative; width: 100%; max-width: 380px;
      background: #FFFFFF; 
      border-radius: var(--radius-medium);
      padding: 40px 30px; text-align: center;
      box-shadow: 0 15px 40px rgba(177, 151, 252, 0.25);
      border: 1px solid rgba(248, 200, 210, 0.8);
      animation: floatAnimation 4s ease-in-out infinite;
    }
    .envelope-icon { font-size: 48px; color: var(--primary-pink); margin-bottom: 20px; }
    .envelope-title { font-size: 2.1rem; color: var(--dark-title); margin-bottom: 10px; font-weight: 600; }
    .envelope-sub { font-size: 0.95rem; color: var(--text-sub); margin-bottom: 30px; }

    .btn-open-envelope {
      background: linear-gradient(135deg, var(--primary-pink), var(--primary-purple));
      color: #fff; border: none; padding: 14px 36px; font-size: 0.95rem;
      font-family: 'Montserrat', sans-serif; font-weight: 500;
      border-radius: 50px; cursor: pointer;
      box-shadow: 0 8px 25px rgba(232, 141, 158, 0.35); transition: var(--transition);
      position: relative; z-index: 10;
      display: inline-block;
    }
    .btn-open-envelope:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(177, 151, 252, 0.45); }

    @keyframes floatAnimation {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* ==========================================================================
       3. FLOATING AUDIO PLAYER WIDGET
       ========================================================================== */
    .audio-player-widget {
      position: fixed; bottom: 25px; right: 25px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      padding: 8px 16px 8px 10px; border-radius: 50px;
      display: flex; align-items: center; gap: 12px;
      box-shadow: var(--shadow-soft); z-index: 1000;
    }
    .vinyl-disk {
      width: 38px; height: 38px; border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-pink), var(--primary-purple));
      display: flex; justify-content: center; align-items: center;
      color: #fff; font-size: 14px; position: relative;
    }
    .vinyl-disk::after { content: ''; position: absolute; width: 10px; height: 10px; background: #FFF0F3; border-radius: 50%; }
    .vinyl-disk.spinning { animation: spin 4s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .audio-controls-btn { background: none; border: none; color: var(--dark-title); font-size: 16px; cursor: pointer; }
    .volume-slider { width: 60px; accent-color: var(--primary-pink); cursor: pointer; }

    /* ==========================================================================
       4. SCRAPBOOK HERO (NỀN HOA LÁ BƯỚM TỰ NHIÊN - KHÔNG DÙNG ẢNH BỊ MỜ)
       ========================================================================== */
    .scrapbook-hero {
      position: relative; width: 100%; min-height: 640px; padding: 60px 20px;
      overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;
      /* Nền trang trí hoa lá bướm tự nhiên pastel */
      background: linear-gradient(180deg, rgba(255, 240, 243, 0.8) 0%, rgba(243, 232, 255, 0.9) 100%),
                  url('https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
    }

    /* Hiệu ứng mờ bướm & hoa nhẹ nhàng cho nền */
    .hero-overlay-mask {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 20% 30%, rgba(248, 200, 210, 0.4) 0%, transparent 50%),
                  radial-gradient(circle at 80% 70%, rgba(210, 180, 255, 0.4) 0%, transparent 50%);
      z-index: 2;
    }

    .hero-header-text { position: relative; z-index: 3; text-align: center; margin-bottom: 40px; }
    .hero-header-text h1 { font-size: 3.8rem; color: var(--dark-title); text-shadow: 0 2px 10px rgba(255,255,255,0.9); }
    .hero-header-text p { font-size: 1.8rem; color: var(--primary-pink); font-weight: 700; margin-top: 5px; }

    .scrapbook-collage-container {
      position: relative; z-index: 3; width: 100%; max-width: 950px; height: 420px; margin: 0 auto;
    }

    .polaroid-card {
      position: absolute; background: #FFFFFF; padding: 12px 12px 38px 12px;
      box-shadow: var(--shadow-soft); transition: var(--transition); cursor: pointer; border-radius: 6px;
    }
    .polaroid-card img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 4px; }
    .polaroid-caption { 
      position: absolute; bottom: 4px; left: 0; width: 100%; 
      text-align: center; font-size: 1.5rem; color: var(--dark-title); 
    }

    .polaroid-card::before {
      content: ''; position: absolute; top: -12px; left: 35%; width: 80px; height: 24px;
      background: rgba(225, 200, 255, 0.7); border: 1px solid rgba(255, 255, 255, 0.6);
      transform: rotate(-3deg); backdrop-filter: blur(2px); box-shadow: 0 2px 5px rgba(0,0,0,0.03); z-index: 5;
    }

    .p-card-1 { width: 320px; height: 260px; top: 20px; left: 5%; transform: rotate(-6deg); z-index: 3; }
    .p-card-2 { width: 250px; height: 310px; top: 10px; right: 8%; transform: rotate(5deg); z-index: 4; }
    .p-card-3 { width: 380px; height: 280px; top: 100px; left: 28%; transform: rotate(2deg); z-index: 5; }

    .polaroid-card:hover {
      transform: scale(1.08) rotate(0deg) !important; z-index: 20 !important;
      box-shadow: 0 20px 40px rgba(177, 151, 252, 0.35);
    }

    /* ==========================================================================
       5. GALLERY KỶ NIỆM
       ========================================================================== */
    .container { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
    .section-title { text-align: center; font-size: 2.8rem; color: var(--dark-title); margin-bottom: 5px; }
    .section-desc { text-align: center; color: var(--text-sub); font-size: 1rem; margin-bottom: 40px; }

    .horizontal-gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; margin-bottom: 60px; }

    .gallery-photo-card {
      background: rgba(255, 255, 255, 0.9); border-radius: var(--radius-medium);
      overflow: hidden; box-shadow: 0 8px 20px rgba(177, 151, 252, 0.15);
      transition: var(--transition); cursor: pointer; border: 6px solid #fff;
    }
    .gallery-photo-card:hover { transform: translateY(-8px); box-shadow: 0 15px 30px rgba(177, 151, 252, 0.3); }
    .gallery-photo-card img { width: 100%; height: 230px; object-fit: cover; display: block; transition: transform 0.5s ease; }
    .gallery-photo-card:hover img { transform: scale(1.06); }
    .photo-info { padding: 12px; text-align: center; font-size: 0.95rem;
